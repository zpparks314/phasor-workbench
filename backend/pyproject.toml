[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phasor-workbench-backend"
version = "0.1.0"
description = "Backend services for Phasor Workbench."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Zachary Parks" }]

# Core dependencies only. Qiskit and NumPy are not needed until Milestone 4
# and are isolated in the `simulation` extra below -- see the note there. The
# extra stays optional on its original merit (nothing before Milestone 4 uses
# it), not because of any interpreter constraint; that one is gone.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Milestone 4. Installs on every interpreter this project claims, 3.11 through
# 3.14, verified on 2026-08-02 and covered by both CI legs.
#
# The floor is 2.1, not the 1.2 it was, and the reason is load-bearing rather
# than a preference for newer. Qiskit 2.x ships `cp310-abi3` wheels -- the
# stable ABI, so one wheel serves every CPython from 3.10 up, including
# versions released after the wheel was built. That is why 3.14 works despite
# no cp314 tag existing anywhere in the dependency tree, and it is why the
# earlier "Qiskit publishes no 3.14 wheels" note expired without anyone
# publishing a 3.14 wheel. Qiskit 1.x predates that packaging and cannot
# install on 3.14, so a 1.2 floor would leave the interpreter claim depending
# on the resolver preferring newest -- true today, and not a guarantee.
simulation = [
    "qiskit>=2.1,<3",
    "numpy>=2.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Starlette's TestClient requires httpx2; using httpx raises a
    # deprecation warning, which `filterwarnings = ["error"]` treats as fatal.
    "httpx2>=2.9",
    "ruff>=0.8",
    "mypy>=1.13",
    # Generates src/phasor_workbench/models/circuit.py from
    # shared/schema/circuit.schema.json. See ADR-0004 and
    # shared/generate_bindings.py -- never edit the generated file by hand.
    #
    # Pinned to a patch range rather than a floor. CI compares the generated
    # output byte-for-byte, so a version that differs from the one a developer
    # generated with fails the check with no real drift to fix. The npm side
    # gets this for free from package-lock.json. Bumping the minor version is a
    # deliberate act: regenerate and commit the result in the same change.
    "datamodel-code-generator~=0.71.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phasor_workbench"]

# --- Testing -------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/phasor_workbench"]
branch = true

# --- Linting and formatting ---------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Generated from shared/schema/circuit.schema.json. Docstrings carry the schema
# descriptions verbatim and exceed the line limit; wrapping them is not the
# generator's job and the file is never hand-edited. Every other rule still
# applies, so genuinely broken generation is still caught.
"src/phasor_workbench/models/circuit.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# --- Type checking -------------------------------------------------------

[tool.mypy]
# No `python_version` pin. It was "3.11" -- the floor -- so that a developer on
# a newer interpreter still saw 3.11 incompatibilities. Installing the
# `simulation` extra turned that into a false failure: our tests import pytest,
# mypy follows into `_pytest.python_api`, which imports numpy under
# TYPE_CHECKING, and NumPy 2.5's stubs use PEP 695 `type` statements that a
# checker targeting 3.11 cannot parse. It is unfixable from our side --
# `follow_imports = "skip"` does not help, because the failure is in the parser
# and happens before any of that applies.
#
# Unpinned, mypy targets whatever interpreter it runs on, and the CI matrix
# does the job the pin was doing -- better, because each leg checks its own
# version against the dependency set that version actually resolves. NumPy 2.5
# and SciPy 1.18 require >=3.12, so the 3.11 leg installs older ones whose
# stubs parse at 3.11, and the mismatch cannot arise there.
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["qiskit.*"]
ignore_missing_imports = true
