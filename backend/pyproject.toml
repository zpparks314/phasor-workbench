[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phasor-workbench-backend"
version = "0.1.0"
description = "Backend services for Phasor Workbench."
readme = "README.md"
requires-python = ">=3.11"

# Core dependencies only. Qiskit and NumPy are not needed until Milestone 4
# and are isolated in the `simulation` extra below -- see the note there.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Milestone 4. Qiskit does not yet publish wheels for Python 3.14, so this
# extra requires 3.11-3.13. Keeping it optional lets the foundation install
# and run on newer interpreters in the meantime.
simulation = [
    "qiskit>=1.2,<3",
    "numpy>=2.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Starlette's TestClient requires httpx2; using httpx raises a
    # deprecation warning, which `filterwarnings = ["error"]` treats as fatal.
    "httpx2>=2.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phasor_workbench"]

# --- Testing -------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/phasor_workbench"]
branch = true

# --- Linting and formatting ---------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# --- Type checking -------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["qiskit.*"]
ignore_missing_imports = true
