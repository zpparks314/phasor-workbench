name: Deploy GitHub Pages

# Initially manual. After production verification, add push: { branches: [main] }
# here to deploy main automatically. Keep the checks and main-only guard below.
# See docs/Deployment.md for first deployment and the transition to automation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Only publishing requires this value. Ordinary CI and local builds
      # deliberately work before a Render service or its URL exists.
      - name: Validate production API origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VITE_API_BASE_URL ?? '';
          let valid = false;
          try {
            const url = new URL(value);
            valid = url.protocol === 'https:' &&
              !url.username && !url.password && !url.search && !url.hash &&
              value.replace(/\/+$/, '') === url.origin;
          } catch {}
          if (!valid) {
            console.error('::error::Set the repository variable VITE_API_BASE_URL to the real HTTPS backend origin, without /api/v1, credentials, query, or fragment. See docs/Deployment.md.');
            process.exit(1);
          }
          NODE

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCK_API: 'false'
        run: npm run build -- --base=/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
