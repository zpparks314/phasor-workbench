name: CI

# Enforces the mechanical half of the Definition of Done in docs/Roadmap.md:
# tests, linting, and type checking pass, and the application still builds.
# The other half -- documentation updated, code reviewed -- stays human.

on:
  push:
    branches: [main]
  pull_request:

# The default token is broader than any job here needs.
permissions:
  contents: read

# Three pushes to a branch should not burn three full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing leg, not just the first.
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject.toml claims; 3.14 is what we develop on.
        # An untested claim rots -- which is the whole reason both legs now
        # install the `simulation` extra as well. Qiskit 2.x ships stable-ABI
        # wheels and installs on both, so the 3.11-3.13 job this comment used
        # to promise is not needed and no third leg was added.
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # --only-binary=:all: for the simulation extra's sake: Qiskit, NumPy and
      # SciPy all build from source given the chance, turning a 30-second step
      # into a toolchain-dependent one that can fail for reasons unrelated to
      # this repository. Failing outright is the better signal -- a missing
      # wheel is exactly the condition that made the interpreter a question in
      # the first place, and it should be loud if it ever returns.
      - name: Install
        # Single-quoted: `:all:` followed by a space is a YAML mapping otherwise.
        run: 'pip install --only-binary=:all: -e ".[dev,simulation]"'

      - name: Lint
        run: ruff check .

      # --check, not the bare `ruff format` in CLAUDE.md, which rewrites files.
      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor claimed by package.json engines and the README.
        node-version: ['20.19', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: installs strictly from the lockfile and
      # fails if package.json and the lockfile have drifted. That drift is
      # invisible locally.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the app is still deployable -- the last Definition of Done
      # criterion a machine can check.
      - name: Build
        run: npm run build

  # Proves the development images still build. Without this the Dockerfiles
  # rot silently and the breakage surfaces months later, the first time
  # someone runs `docker compose up`.
  #
  # Plain `docker build` rather than a third-party build action: the runner
  # already has Docker, and CLAUDE.md asks for dependencies to be minimised.
  # Images are built, not run -- verifying the dev experience itself needs a
  # human at a machine.
  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target development -t phasor-workbench-backend:ci ./backend

      - name: Build frontend image
        run: docker build --target development -t phasor-workbench-frontend:ci ./frontend

  # Proves the committed bindings still match the schema they came from. Per
  # ADR-0004 the schema is the source of truth and bindings are generated into
  # each project, so a schema edit without a regeneration leaves the two
  # languages describing different circuits -- exactly the drift generation was
  # chosen to make impossible. Nothing else in this workflow would catch it:
  # both projects would lint, type check and build perfectly against a stale
  # model.
  #
  # The only job needing both toolchains, because it drives both generators.
  # Versions are pinned rather than floating (pyproject for Python, the
  # lockfile for npm): the comparison is byte-for-byte, so a generator version
  # differing from the developer's fails with no real drift to fix.
  schema:
    name: Shared model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.14 is what the model is developed and generated on natively.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dev dependencies
        run: pip install -e "./backend[dev]"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # --check reports staleness and restores the tree; it never rewrites the
      # committed output to make itself pass.
      - name: Verify generated bindings are current
        run: python shared/generate_bindings.py --check

  # Single stable status check for branch protection. Matrix job names carry
  # their version ('Backend (Python 3.11)'), so requiring them directly means
  # every matrix change silently leaves a leg unprotected until someone
  # remembers to update the rule. Requiring this one job instead stays correct.
  ci:
    name: CI
    if: always()
    needs: [backend, frontend, images, schema]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
